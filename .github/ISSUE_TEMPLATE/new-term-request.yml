name: Suggest a new term
description: Propose a term that NucLex does not currently have
title: "[New term]: "
labels: ["new term"]
body:
  - type: input
    id: label
    attributes:
      label: Proposed term
      placeholder: time-of-flight resolution
    validations:
      required: true

  - type: textarea
    id: rationale
    attributes:
      label: What is it, and why is it needed?
      description: >
        A sentence or two on what the term means and what you are trying to
        describe that NucLex cannot describe today.
    validations:
      required: true

  - type: input
    id: contact
    attributes:
      label: Your name and affiliation
    validations:
      required: true
